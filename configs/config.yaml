server:
  port: 18080
  mode: debug  # debug | release | test

temporal:
  host: localhost
  port: 7233
  namespace: default
  task_queue: weave-task-queue

postgres:
  host: localhost
  port: 5432
  user: weave
  password: weave123
  database: weave
  sslmode: disable

neo4j:
  uri: bolt://localhost:7687
  user: neo4j
  password: weave123

redis:
  addr: localhost:6379
  password: ""
  db: 0

knowledge:
  # Local knowledge paths should be provided through environment variables.
  # Example:
  #   export WEAVE_NUCLEI_TEMPLATES_PATH="$HOME/nuclei-templates"
  #   export WEAVE_KEV_PATH="$HOME/weave-knowledge/known_exploited_vulnerabilities.json"
  #   export WEAVE_EPSS_PATH="$HOME/weave-knowledge/epss_scores-current.csv.gz"
  #   export WEAVE_VULNRICHMENT_PATH="$HOME/weave-knowledge/vulnrichment"
  nuclei_templates_path: ${WEAVE_NUCLEI_TEMPLATES_PATH}
  product_aliases_path: ""
  kev_path: ${WEAVE_KEV_PATH}
  epss_path: ${WEAVE_EPSS_PATH}
  vulnrichment_path: ${WEAVE_VULNRICHMENT_PATH}
  max_templates_per_lookup: 80

artifacts:
  gogo:
    threads: 100
    timeout: 300s
  spray:
    threads: 50
    timeout: 120s
  fingers:
    timeout: 60s
  neutron:
    capacity: 30
    timeout: 300s
  zombie:
    capacity: 20
    timeout: 300s
